name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ApiLifecycle.slnx
      - run: dotnet build ApiLifecycle.slnx -c Release --no-restore
      - run: dotnet test --solution ApiLifecycle.slnx -c Release --no-build
      - run: dotnet pack ApiLifecycle.slnx -c Release --no-build -o artifacts/packages
      - name: Verify package metadata and 150 KiB budget
        shell: pwsh
        run: ./scripts/Verify-Packages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
